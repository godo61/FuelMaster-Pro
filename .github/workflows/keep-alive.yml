name: FuelMaster Pro Life Support

on:
  schedule:
    - cron: '30 9 * * 1,4' # Se ejecutará a las 09:30 UTC solo lunes (1) y jueves (4)
  workflow_dispatch:      # Para que puedas darle al botón de "probar" manualmente

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Database
        run: |
          curl -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/fuel_entries?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
